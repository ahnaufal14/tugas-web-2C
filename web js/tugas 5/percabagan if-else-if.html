<!DOCTYPE html>
<html>
<head>
    <title>Percabangan if-else-if</title>
</head>
<body>
  <h1>Tugas 5 JavaScript Percabangan if-else-if</h1>

  <!-- percabangan if-else-if -->
   <script type="text/javascript">
        let nilai = prompt('Masukan Nilai Anda');
 
        if (nilai > 85) {
            document.write('<h2>Nilai A</h2>');
        } else if(nilai >= 75) {
            document.write('<h2>Nilai B</h2>');
        } else {
            document.write('<h2>Nilai C</h2>');
        }
    </script>
