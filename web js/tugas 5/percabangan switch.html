<!DOCTYPE html>
<html>
<head>
    <title>Percabangan switch</title>
</head>
<body>
  <h1>Tugas 5 JavaScript Percabangan switch</h1>

<!-- percabangan switch -->
   <script type="text/javascript">
        let hari = prompt('Masukan Kode Hari [1 s/d 7]');
 
        switch(hari) {
            case "1" : 
            document.write('<h2> hari senin</h2>');
            break;
            case "2" : 
            document.write('<h2> hari selasa</h2>');
            break;
            case "3" : 
            document.write('<h2> hari rabu</h2>');
            break;
            case "4" : 
            document.write('<h2> hari kamis</h2>');
            break;
            case "5" : 
            document.write('<h2> hari jumat</h2>');
            break;
            case "6": 
            document.write('<h2> hari sabtu</h2>');
            break;
            case "7" : 
            document.write('<h2> hari minggu</h2>');
            break;
            default :
            document.write('<h2>kode tidak sesuai</h2>');
        }
    </script>
