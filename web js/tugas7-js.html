<!DOCTYPE html>
<html>
<head>
    <title>Penggunaan Array</title>
</head>
<body>
 
    <script type="text/javascript">
        // membuat Array
        var siswa = ['naufal','luqi','fahmi','zaki'];
        console.log(siswa); 
    </script>

    <script type="text/javascript">
        // membuat Array
        var siswa = ['naufal','luqi','fahmi','zaki'];
        console.log(siswa); //menampilkan semua data
 
        var harga = [1000, 2000, 5000, 3000];
        console.log(harga[3]); //menampikan data ke - 3
 
        //merubah isi Array
        siswa[4]='anton';
        console.log(siswa);
 
        harga[1]=1500;
        console.log(harga);
 
    </script>

    <script type="text/javascript">
        // membuat Array
        var siswa = ['naufal','luqi','fahmi','zaki'];
        console.log(siswa); //menampilkan semua data
 
        var harga = [1000, 2000, 5000, 3000];
        console.log(harga[3]); //menampikan data ke - 3
 
        //menampilkan array dengan perulangan
        siswa.forEach(function(data){
            document.write('<h2>Nama mahasiswa adalah '+data+'</h2><br>');
        });
 
    </script>
 
</body>
</html>
